name: moving-features-visualizer

services:
  visualizer:
    build:
      # This Compose file is under ./docker, while the Vite project is one level up.
      context: ..
      dockerfile: docker/Dockerfile
    container_name: moving-features-visualizer
    ports:
      - "${VISUALIZER_PORT:-9090}:80"
    restart: unless-stopped
    depends_on:
      mf-api:
        condition: service_healthy
    networks:
      - mf-workshop

  mf-api:
    image: ghcr.io/taehoonk/pygeoapi-mf-api:latest
    # For MacOS #
    platform: linux/amd64
    # # # # # # #
    container_name: pygeoapi-mf-api

    volumes:
      - ./mf-api.config.yml:/pygeoapi/local.config.yml:ro

    ports:
      - "${MF_API_PORT:-5050}:80"

    depends_on:
      mobilitydb:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/collections', timeout=3).read()"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

    restart: unless-stopped

    networks:
      - mf-workshop

  mobilitydb:
    image: ghcr.io/taehoonk/pygeoapi-mf-api-mobilitydb:latest
    # For MacOS #
    platform: linux/amd64
    # # # # # # #
    container_name: mobilitydb
    ports:
      - "${MOBILITYDB_PORT:-25432}:5432"
    environment:
      POSTGRES_DB: mobilitydb
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
    volumes:
      - mobilitydb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d mobilitydb"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: on-failure
    networks:
      - mf-workshop

volumes:
  mobilitydb-data:

networks:
  mf-workshop:
    driver: bridge
