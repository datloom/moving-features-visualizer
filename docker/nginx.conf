server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite/React SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite normally emits hashed assets under /assets/.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not aggressively cache the SPA entry point during a workshop.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
